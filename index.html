@media (pointer:coarse){#tc{display:flex}}

<canvas id="c"></canvas>
<div id="tc"><div id="js"><i id="kn"></i></div><div class="a"><button data-k="p">COUP</button><button data-k="k">PIED</button><button data-k="s">SPÉC.</button><button data-k="x">UPPER</button><button data-k="y">ULTI</button><button data-k="b">BLOC</button><button data-k="d">ESQ.</button></div></div>
<div id="ov"><div id="in"></div></div>
<script>

addEventListener('resize',rs);rs();
const FL=450;

{n:'KAGE',e:'🥷',c:'#19f3ff',sp:310,pw:1,hp:100,pr:640,ps:9,lw:7,d:'Ninja rapide · lance des shurikens'},
{n:'BRAWL',e:'🥊',c:'#ff7a1a',sp:230,pw:1.35,hp:125,pr:480,ps:15,lw:10,d:'Colosse lent · coups dévastateurs'},
{n:'NOVA',e:'🔮',c:'#ff2bd6',sp:275,pw:.95,hp:100,pr:430,ps:20,lw:7,d:'Maître de l’énergie · grosse boule'},
{n:'VIPER',e:'🐍',c:'#8aff2b',sp:340,pw:.9,hp:90,pr:700,ps:8,lw:6,d:'Très mobile · fragile mais vif'}];
let ci=0,P,E,st='menu',rt=0,round=1,shake=0,hs=0,parts=[],proj=[],combo=0,ct=0,timer=60,time=0,keys={},tk={};
const sky=Array.from({length:14},(_,i)=>[i*72+Math.random()*30,60+Math.random()*170,40+Math.random()*30]);
function mk(c,x,f,ai){const h=C[c];return{ch:h,x,y:FL,vx:0,vy:0,f,hp:h.hp,mhp:h.hp,en:50,st:'idle',t:0,did:0,ai,cd:0,aiT:0,dec:{},wins:0}}
function menu(res){
 if(res){inn.innerHTML=`<h1>${res}</h1><h2>${res==='VICTOIRE'?'TU ES LE CHAMPION':'RELÈVE-TOI ET REVIENS'}</h2><div class="btn" data-a="go">REJOUER ▶</div><div class="btn s" data-a="m">CHANGER</div>`}
 else inn.innerHTML='<h1>NEON FIGHTERS</h1><h2>CHOISIS TON COMBATTANT</h2><div class="g">'+C.map((c,i)=>`<div class="k${i===ci?' on':''}" data-a="c" data-i="${i}"><b>${c.e}</b><span style="color:${c.c}">${c.n}</span><small>${c.d}</small><small>PUISSANCE</small><div class="bar"><i style="width:${c.pw*60}%"></i></div><small>VITESSE</small><div class="bar"><i style="width:${c.sp/3.5}%"></i></div><small>VIE</small><div class="bar"><i style="width:${c.hp/1.4}%"></i></div></div>`).join('')+'</div><div class="btn" data-a="go">COMBAT ▶</div><div class="hint">← → / A D : bouger (ou joystick tactile) · ↑ / W : sauter · ↓ / S : bloquer · ESPACE : esquiver<br>J : coup de poing · K : coup de pied · L : attaque spéciale<br>AYRO : U uppercut explosif · O ultime Dragon de feu (barre d’énergie pleine)<br>Premier à 2 rounds gagne</div>';
 ov.style.display='flex';st='menu'}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;

  let o;do{o=Math.random()*5|0}while(o===ci);P=mk(ci,300,1,0);E=mk(o,660,-1,1);round=1;newRound();ov.style.display='none'}});
function newRound(){P.x=300;E.x=660;for(const F of[P,E]){F.y=FL;F.vx=F.vy=0;F.hp=F.mhp;F.en=50;F.st='idle';F.t=0;F.cd=0}proj=[];timer=60;combo=0;st='intro';rt=0}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
document.querySelectorAll('#tc button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();tk[k]=1});for(const ev of['pointerup','pointerleave','pointercancel'])b.addEventListener(ev,()=>tk[k]=0)});

function aiIn(F,O,dt){F.aiT-=dt;if(F.aiT<=0){F.aiT=.1+Math.random()*.15;const d=Math.abs(O.x-F.x),tw=O.x>F.x?'r':'l',aw=tw==='r'?'l':'r',r=Math.random(),D={};
 if(['punch','kick','special','upper','ultimate'].includes(O.st)&&d<150&&r<.4)D[r<.18?'d':'b']=1;
 else if(F.en>=100&&d<260&&r<.6)D.y=1;else if(d>270&&F.en>=35&&r<.25)D.s=1;

 F.dec=D}return F.dec}
function go(F,s){F.st=s;F.t=0;F.did=0;F.vx=0;if(F.ai)F.cd=.45+Math.random()*.45}

function spark(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*500,vy:(Math.random()-.8)*400,l:.35,c})}
function land(A,D,dmg,kb){

function strike(A,D,dmg,reach,kb){if(Math.abs(D.x-A.x)>reach||Math.abs(D.y-A.y)>90||(D.x-A.x)*A.f<0)return;A.did=1;land(A,D,dmg,kb)}
function upd(F,O,dt,I){
 F.t+=dt;F.cd-=dt;F.dcd-=dt;const air=F.y<FL-1,free=['idle','walk','block','jump'].includes(F.st);
 if(free){F.f=O.x>F.x?1:-1;F.bl=I.b&&!air;
  if(F.bl){F.st='block';F.vx=0}
  else{const mv=Math.abs(I.ax)>.18?Math.max(-1,Math.min(1,I.ax*1.25)):(I.r?1:0)-(I.l?1:0);F.vx=mv*F.ch.sp*(mv*F.f<0?.8:1);F.st=air?'jump':mv?'walk':'idle';

   if(F.st!=='dodge'&&(!F.ai||F.cd<=0)){if(F.ch.ay&&I.y&&F.en>=100){F.en=0;go(F,'ultimate')}else if(F.ch.ay&&I.x&&F.en>=15){F.en-=15;go(F,'upper')}else if(I.p)go(F,'punch');else if(I.k)go(F,'kick');else if(I.s&&F.en>=35){F.en-=35;go(F,'special')}}}}
 if(DUR[F.st]){if(!air)F.vx=0;
  if(F.ch.ay&&(F.st==='punch'||F.st==='upper')&&F.t>.05)parts.push({x:F.x+F.f*(F.st==='punch'?70:40),y:F.y-(F.st==='punch'?115:130),vx:(Math.random()-.5)*80,vy:-160,l:.3,c:Math.random()<.5?'#ff7a1a':'#ffe600'});
  if(F.st==='punch'&&!F.did&&F.t>.08)strike(F,O,F.ch.ay?10:7,90,260);
  if(F.st==='kick'&&!F.did&&F.t>.16)strike(F,O,11,110,380);
  if(F.st==='upper'&&!F.did&&F.t>.14){strike(F,O,14,85,200);if(F.did){O.vy=-650;O.y-=2;spark(O.x,O.y-100,'#ff7a1a',18);shake=12}}
  if(F.st==='ultimate'&&!F.did&&F.t>.4){F.did=1;proj.push({x:F.x+F.f*50,y:F.y-90,vx:F.f*520,o:F,dr:1,f:F.f});shake=14;spark(F.x,F.y-90,'#ff7a1a',30)}
  if(F.st==='special'&&!F.did&&F.t>.22){F.did=1;proj.push({x:F.x+F.f*50,y:F.y-95,vx:F.f*F.ch.pr,o:F})}
  if(F.t>=DUR[F.st])F.st='idle'}
 if(F.st==='dodge'){F.vx*=.93;if(Math.random()<.7)parts.push({x:F.x,y:F.y-30-Math.random()*90,vx:0,vy:-30,l:.25,c:'rgba(255,255,255,.8)'});if(F.t>.32)F.st='idle'}
 if(F.st==='hit'){F.vx*=.92;if(F.t>.35)F.st='idle'}
 if(F.st==='ko')F.vx*=.97;
 F.vy+=2300*dt;F.y+=F.vy*dt;if(F.y>=FL){F.y=FL;F.vy=0}
 F.x=Math.max(40,Math.min(920,F.x+F.vx*dt));
 if(F.st!=='ko'&&O.st!=='ko'&&Math.abs(F.x-O.x)<46&&Math.abs(F.y-O.y)<60){const s=F.x<O.x?-1:1;F.x+=s*140*dt;O.x=Math.max(40,Math.min(920,O.x-s*140*dt))}

function endRound(){const w=P.hp>E.hp?P:E.hp>P.hp?E:null;if(w)w.wins++;st='over';rt=0;if(P.st!=='ko'&&E.st!=='ko')(P.hp<E.hp?P:E).st='ko'}
function update(dt){
 time+=dt;if(st==='menu'||!P)return;
 if(hs>0){hs-=dt;return}
 shake=Math.max(0,shake-dt*30);ct-=dt;if(ct<=0)combo=0;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 if(st==='intro'){rt+=dt;if(rt>2)st='fight';upd(P,E,dt,{l:0,r:0});upd(E,P,dt,{l:0,r:0});return}
 const fight=st==='fight';
 upd(P,E,dt,fight?pin():{l:0,r:0});upd(E,P,dt,fight?aiIn(E,P,dt):{l:0,r:0});
 for(const p of proj){p.x+=p.vx*dt;const T=p.o===P?E:P;
  if(T.st!=='ko'&&T.st!=='dodge'&&Math.abs(p.x-T.x)<(p.dr?70:40)&&Math.abs(p.y-(T.y-80))<(p.dr?95:75)){land(p.o,T,p.dr?32:14,p.dr?520:300);p.dead=1}
  if(p.x<0||p.x>960)p.dead=1}
 proj=proj.filter(p=>!p.dead);
 if(fight){timer-=dt;if(P.st==='ko'||E.st==='ko'||timer<=0){if(timer<0)timer=0;endRound()}}
 else if(st==='over'){rt+=dt;if(rt>2.8){if(P.wins>=2||E.wins>=2)menu(P.wins>=2?'VICTOIRE':'DÉFAITE');else{round++;newRound()}}}}
function limb(o,l1,a1,l2,a2,f){const m=[o[0]+Math.cos(a1)*l1*f,o[1]+Math.sin(a1)*l1],e=[m[0]+Math.cos(a2)*l2*f,m[1]+Math.sin(a2)*l2];g.beginPath();g.moveTo(o[0],o[1]);g.lineTo(m[0],m[1]);g.lineTo(e[0],e[1]);g.stroke()}
const lp=(a,b,t)=>a+(b-a)*t;
function drawFold(F){
 const f=F.f,s=F.st,ay=F.ch.ay;g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.ellipse(F.x,FL+4,46-(FL-F.y)/8,9,0,0,7);g.fill();

 const dur=DUR[s],p=dur?Math.min(1,F.t/dur):0,e=Math.sin(Math.PI*p),w=s==='walk'?Math.sin(time*13):0,bob=s==='idle'?Math.sin(time*5)*2:0;
 const lean=s==='hit'?-.3:s==='punch'?.18:s==='kick'?-.12:s==='block'?.08:0,hy=-72+bob+(s==='block'?10:0),sh=[Math.sin(lean)*52*f,hy-Math.cos(lean)*52];

 if(s==='hit'||s==='ko'){fa1=ba1=1.9;fa2=ba2=1.5}
 g.lineWidth=F.ch.lw;g.globalAlpha=.55;if(ay)g.strokeStyle='#3a3a3a';limb([0,hy],37,bl1,37,bl2,f);g.strokeStyle=F.ch.c;limb(sh,36,ba1,34,ba2,f);g.globalAlpha=1;

 g.lineWidth=F.ch.lw;if(ay)g.strokeStyle='#3a3a3a';limb([0,hy],37,fl1,37,fl2,f);g.strokeStyle=F.ch.c;limb(sh,36,fa1,34,fa2,f);

 g.restore()}
